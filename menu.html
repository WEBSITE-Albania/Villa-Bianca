<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "Inter", sans-serif;
    background: #f7f2ec; 
    color: #2c1e16;
}

html { scroll-behavior: smooth; }

/* NAVBAR */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(238, 222, 198, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 1000;
    box-shadow: 0 4px 15px rgba(139, 105, 80, 0.08);
}

/* TOP NAV */
.nav-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px 10px 20px;
}

.logo {
    font-family: "Cormorant Garamond", serif;
    font-size: 24px;
    font-weight: 600;
    color: #3e2723;
    cursor: pointer;
}

.lang {
    display: flex;
    gap: 8px;
}

.lang button {
    border: none;
    padding: 6px 10px;
    border-radius: 20px;
    cursor: pointer;
    background: rgba(139, 105, 80, 0.15);
    color: #3e2723;
    font-size: 14px;
    transition: 0.3s;
}

.lang button:hover {
    background: #FFC94D;
    color: #111;
}

/* CATEGORY NAV (Scrollable & Centered if space allows) */
.nav-bottom {
    display: flex;
    overflow-x: auto;
    padding: 10px 20px 15px 20px;
    scrollbar-width: none; /* Firefox */
}
.nav-bottom::-webkit-scrollbar { display: none; } /* Chrome/Safari */

.nav-inner {
    display: flex;
    gap: 12px;
    margin: 0 auto; /* E mban në qendër kur ka pak kategori */
}

.cat {
    flex: 0 0 auto;
    padding: 8px 18px;
    border-radius: 25px;
    border: 1px solid rgba(139, 105, 80, 0.2);
    background: rgba(255, 255, 255, 0.4);
    color: #4a3625;
    font-family: "Inter", sans-serif;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.35s ease;
}

.cat:hover {
    background: rgba(255, 201, 77, 0.3);
}

.cat.active {
    background: #FFC94D;
    color: #2e1e10;
    border-color: #FFC94D;
    box-shadow: 0 4px 12px rgba(255, 201, 77, 0.4);
}

/* MAIN */
main {
    padding-top: 130px;
    padding-bottom: 50px;
}

/* SECTION */
.section {
    padding: 40px 10px 10px 10px;
}

.section-title {
    text-align: center;
    margin-bottom: 30px;
}

.section-title h2 {
    font-family: "Cormorant Garamond", serif;
    font-size: 2.5rem;
    color: #2c1e16;
    position: relative;
    display: inline-block;
}

.section-title h2::after {
    content: "";
    width: 50px;
    height: 2px;
    background: #FFC94D;
    display: block;
    margin: 8px auto 0;
}

/* PRODUCT */
.product {
    width: 60%;
    max-width: 600px;
    margin: 0 auto 30px auto;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(139, 105, 80, 0.08);
    border: 1px solid rgba(222, 196, 153, 0.2);
    transition: 0.3s ease;
}

.product:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(139, 105, 80, 0.15);
}

.img {
    width: 100%;
    aspect-ratio: 4 / 3; 
    position: relative;
    background: #e9e3dc; /* Placeholder color kur s'ka imazh */
}

.img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.price {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: #FFC94D;
    color: #2e1e10;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.content {
    padding: 16px 20px;
    text-align: center;
}

.content h3 {
    font-family: "Cormorant Garamond", serif;
    font-size: 22px;
    margin-bottom: 6px;
    color: #2c1e16;
}

.content p {
    font-size: 14px;
    color: #726052;
    line-height: 1.5;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 25px 15px;
    background: #1a1612;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
}

@media (max-width: 768px) {
    .product {
        width: 65%;
        min-width: 250px;
    }
}
</style>
</head>

/* ---------------------------------------------------------------------
   Language persistence helpers (wrapped in try/catch so a restricted
   preview environment can never throw and break the whole script —
   on a normal web host this behaves exactly like plain localStorage).
--------------------------------------------------------------------- */
function getStoredLang() {
    try { return localStorage.getItem("lang"); } catch (e) { return null; }
}
function setStoredLang(lang) {
    try { localStorage.setItem("lang", lang); } catch (e) { /* ignore */ }
}

let currentLang = getStoredLang() || "sq";
let observer;
let isClickScrolling = false;
let clickScrollTimeout = null;
let scrollScheduled = false;

function renderMenu() {
    const menu = document.getElementById("menu");
    const nav = document.getElementById("navCats");

    menu.innerHTML = "";
    nav.innerHTML = "";

    categories.forEach(c => {
        nav.innerHTML += `<button class="cat" data-id="${c.id}">${c[currentLang].title}</button>`;

        let itemsHtml = "";
        c.items.forEach(item => {
            const priceHtml = item.price.trim() !== "" ? `<div class="price">${item.price}</div>` : "";
            const descHtml = item[currentLang].desc.trim() !== "" ? `<p>${item[currentLang].desc}</p>` : "";

            // Nëse nuk ka imazh kthejmë një tag bosh që nuk jep error falë CSS, por jep kutinë placeholder
            const imgTag = item.img.trim() !== "" 
                ? `<img src="${item.img}" alt="${item[currentLang].name}" loading="lazy" onerror="this.style.display='none'">` 
                : '';

            itemsHtml += `
            <div class="product">
                <div class="img">
                    ${imgTag}
                    ${priceHtml}
                </div>
                <div class="content">
                    <h3>${item[currentLang].name}</h3>
                    ${descHtml}
                </div>
            </div>`;
        });

        menu.innerHTML += `
        <section class="section" id="${c.id}">
            <div class="section-title">
                <h2>${c[currentLang].title}</h2>
            </div>
            ${itemsHtml}
        </section>`;
    });

    attachNavClickHandlers();
    initObserver();
}

/* =======================================================================
   NAVIGATION: smooth-scroll on click + accurate scroll-spy
   -----------------------------------------------------------------------
   Strategy: the "active" category is decided by a single source of truth
   — updateActiveSection() — which looks at the real, current position
   (getBoundingClientRect) of every section and picks the last one whose
   top has passed just below the navbar. That decision is triggered both
   by an IntersectionObserver (cheap, event-driven, the preferred modern
   approach) AND by a rAF-throttled scroll listener (a tiny safety net
   that guarantees the activation line can never be "jumped over" during
   a very fast flick/fling, however short or tall a section is). Because
   the decision itself is always recomputed from live geometry, neither
   trigger can produce a wrong/missed result — they only differ in how
   often they ask the same question.
======================================================================= */

function getNavbarHeight() {
    const navbar = document.querySelector(".navbar");
    return navbar ? navbar.offsetHeight : 110;
}

function setActiveButton(id) {
    const btn = document.querySelector(`.cat[data-id="${id}"]`);
    if (!btn || btn.classList.contains("active")) return; // no-op avoids flicker/extra scrollIntoView calls

    document.querySelectorAll(".cat").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    // Requirement 3: keep the active category visible inside the scrollable navbar
    btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}

function updateActiveSection() {
    if (isClickScrolling) return; // a click-triggered scroll is animating; don't fight it with intermediate sections

    const sections = document.querySelectorAll(".section");
    if (!sections.length) return;

    const activationLine = getNavbarHeight() + 1; // just below the fixed navbar

    let activeId = sections[0].id; // sensible default (top of page / before any section passes the line)

    sections.forEach(section => {
        if (section.getBoundingClientRect().top <= activationLine) {
            activeId = section.id; // last section (in document order) that has passed the line wins
        }
    });

    setActiveButton(activeId);
}

function attachNavClickHandlers() {
    document.querySelectorAll(".cat").forEach(btn => {
        btn.onclick = () => {
            const section = document.getElementById(btn.dataset.id);
            if (!section) return;

            isClickScrolling = true;
            clearTimeout(clickScrollTimeout);
            clickScrollTimeout = setTimeout(() => { isClickScrolling = false; }, 1000); // safety net

            setActiveButton(btn.dataset.id); // highlight immediately, don't wait for the animation to finish

            const y = section.getBoundingClientRect().top + window.scrollY - getNavbarHeight();
            window.scrollTo({ top: y, behavior: "smooth" });
        };
    });
}

function initObserver() {
    if (observer) observer.disconnect();

    const sections = document.querySelectorAll(".section");
    const navbarHeight = getNavbarHeight();

    const thresholds = [];
    for (let i = 0; i <= 20; i++) thresholds.push(i / 20);

    observer = new IntersectionObserver(() => {
        updateActiveSection();
    }, {
        rootMargin: `-${navbarHeight}px 0px 0px 0px`,
        threshold: thresholds
    });

    sections.forEach(s => observer.observe(s));

    // Set the correct initial highlight right away (don't wait for the first scroll/observer tick)
    updateActiveSection();
}

// rAF-throttled scroll listener — the accuracy safety net described above
function onWindowScroll() {
    if (scrollScheduled) return;
    scrollScheduled = true;
    requestAnimationFrame(() => {
        updateActiveSection();
        scrollScheduled = false;
    });
}
window.addEventListener("scroll", onWindowScroll, { passive: true });

// Resolve the click-scroll lock as soon as the browser reports the smooth
// scroll truly finished (supported in modern browsers); the timeout above
// still covers browsers without 'scrollend'.
window.addEventListener("scrollend", () => {
    if (isClickScrolling) {
        isClickScrolling = false;
        clearTimeout(clickScrollTimeout);
        updateActiveSection();
    }
});

// Recompute navbar-height-dependent offsets if the viewport changes
// (e.g. mobile rotation) so the system stays accurate on every device.
let resizeTimeout;
window.addEventListener("resize", () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(initObserver, 200);
});

function changeLang(lang) {
    currentLang = lang;
    setStoredLang(lang);
    const scrollPos = window.scrollY; 
    renderMenu();
    window.scrollTo(0, scrollPos);
}

window.onload = () => {
    renderMenu();
};

</script>
